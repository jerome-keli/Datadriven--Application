spring.application.name=pharmacy-stock-app

# --- MongoDB (pharmacies, drugs, stock, reservations, users, stock_logs) ---
# Overridable via SPRING_DATA_MONGODB_URI (used by docker-compose).
# Example Atlas URI: mongodb+srv://<user>:<password>@cluster0.mongodb.net/pharmastock
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/pharmastock}

# --- MySQL (payments only - the ACID-sensitive part of the domain) ---
# Overridable via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (docker-compose).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pharmastock_payments?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=Jfamily7
# 'update' is fine for coursework so Hibernate creates the payments table on
# first run; use a proper migration tool (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Set to true on first run if you want the DataSeeder to populate sample data,
# then set back to false so it doesn't re-seed on every restart.
# Overridable via APP_SEED_ENABLED.
app.seed.enabled=${APP_SEED_ENABLED:true}
